<!DOCTYPE html>
<html>
<head>
    <title>Problem Reporting System - Login</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            margin: 0;
        }

        header {
            background: #1f4e79;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            max-width: 450px;
            margin: 40px auto;
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            color: #1f4e79;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #1f4e79;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
        }

        button:hover {
            background: #163a5c;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .demo {
            background: #eef5ff;
            padding: 15px;
            margin-top: 20px;
            border-left: 5px solid #1f4e79;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h1>🔐 Problem Reporting System</h1>
    <p>Login Portal</p>
</header>


<div class="container">

    <div class="login-box">

        <h2>Login</h2>

        <label>Select User</label>

        <select id="userType">

            <option value="Student">
                Student
            </option>

            <option value="Admin">
                Admin
            </option>

        </select>


        <label>Username</label>

        <input
            type="text"
            id="username"
            placeholder="Enter username"
        >


        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
        >


        <button onclick="login()">
            🔑 Login
        </button>


        <div id="message"></div>


        <div class="demo">

            <b>Demo Login Details</b>

            <br><br>

            👨‍🎓 <b>Student</b>

            <br>

            Username: student

            <br>

            Password: 1234

            <br><br>

            🛠️ <b>Admin</b>

            <br>

            Username: admin

            <br>

            Password: admin123

        </div>

    </div>

</div>


<script>

function login() {

    var userType =
        document.getElementById("userType").value;

    var username =
        document.getElementById("username")
        .value.trim();

    var password =
        document.getElementById("password")
        .value.trim();

    var message =
        document.getElementById("message");


    /* Check empty fields */

    if (username == "" || password == "") {

        message.innerHTML =
            "<span style='color:red;'>" +
            "❌ Please enter username and password." +
            "</span>";

        return;
    }


    /* Student Login */

    if (
        userType == "Student" &&
        username == "student" &&
        password == "1234"
    ) {

        message.innerHTML =
            "<span style='color:green;'>" +
            "✅ Student Login Successful!" +
            "</span>";

        setTimeout(function() {

            window.location.href = "student.html";

        }, 800);

        return;
    }


    /* Admin Login */

    if (
        userType == "Admin" &&
        username == "admin" &&
        password == "admin123"
    ) {

        message.innerHTML =
            "<span style='color:green;'>" +
            "✅ Admin Login Successful!" +
            "</span>";

        setTimeout(function() {

            window.location.href = "admin.html";

        }, 800);

        return;
    }


    /* Wrong Login */

    message.innerHTML =
        "<span style='color:red;'>" +
        "❌ Invalid username or password." +
        "</span>";

}

</script>

</body>
</html>
